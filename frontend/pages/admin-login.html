<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login — 2DBazaar</title>
<link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="border-top: 4px solid #1e293b;">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:36px;margin-bottom:8px;">⚡</div>
      <h2>Admin Portal</h2>
      <p>Login to your 2DBazaar administrator dashboard</p>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="admin@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password"/>
    </div>
    <button class="btn btn-full" onclick="doLogin()" style="margin-top:8px; background:#1e293b; color:#fff; border:none; border-radius:8px; padding:12px; font-weight:600; cursor:pointer; font-family:inherit; font-size:15px; transition: background 0.2s;">Login →</button>
    <p style="text-align:center;font-size:13px;margin-top:20px;"><a href="../index.html" style="color:#64748b;">← Back to Home</a></p>
  </div>
</div>
<script src="../js/data.js"></script>
<script>
function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value.trim();
  if (!email||!pw) { toast('Please fill all fields','error'); return; }
  const user = Auth.login(email, pw);
  if (user) {
    if (user.role !== 'admin') {
      Auth.logout();
      toast('Access denied. Admin role required.','error');
      return;
    }
    toast('Login successful! Redirecting...');
    setTimeout(()=>{ window.location.href = 'admin.html'; }, 800);
  }
  else { toast('Invalid email or password','error'); }
}
document.addEventListener('keypress',e=>{ if(e.key==='Enter') doLogin(); });
if(Auth.current() && Auth.isAdmin()) window.location.href='admin.html';
</script>
</body>
</html>
